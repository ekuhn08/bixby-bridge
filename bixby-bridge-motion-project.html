  const cloudImg = new Image();

  // Deterministic pseudo-random size/height per cloud index, so raising
  // the cloud-amount slider beyond the old fixed 8 presets still varies
  // naturally instead of repeating or going undefined.
  function cloudVariant(i){
    const h1=Math.sin(i*12.9898+3.1)*43758.5453; const r1=h1-Math.floor(h1);
    const h2=Math.sin(i*78.233+7.7)*12543.113; const r2=h2-Math.floor(h2);
    return { size: 0.62+r1*0.46, height: (r2-0.5)*0.09 };
  }
  // No shape traces the ridge anymore — that always reads as "a mask" no
  // matter how soft its edge, since its contour matches the mountain
  // exactly. Instead, a plain vertical gradient fades clouds out by
  // altitude only, so any given cloud's own soft png edge decides whether
  // it grazes a peak; nothing is ever hard-clipped along the skyline.
  function cloudFadeGradient(target){
    const proximity=+cloudMaskOffsetEl.value; // how low the haze is allowed to sink
    const center=H*0.30+proximity, spread=H*0.22;
    const top=Math.max(0,(center-spread)/H), bottom=Math.min(1,(center+spread)/H);
    const g=target.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(top,'rgba(255,255,255,1)');
    g.addColorStop(bottom,'rgba(255,255,255,0)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    return g;
  }
  function drawCloud(time){

    if(!cloudToggle.checked || !cloudImg.complete) return;
    const scale=+cloudSizeEl.value/100;
    const baseW=W*.34*scale;
    const count=+cloudAmountEl.value;
    const spacing=.20+(+cloudSpacingEl.value/100)*.46;
    const route=Math.max(1.35,count*spacing);
    const travel=(.32+time*(+cloudSpeedEl.value)*.0006)%route;
    const baseY=H*(+cloudHeightEl.value/100);
    cloudCtx.save();
    for(let i=0;i<count;i++){
      const variant=cloudVariant(i);
      const size=(i===0?1:variant.size), yOffset=(i===0?0:variant.height), direction=i%2?-1:1;
      const lane=(travel+i*spacing)%route;
      const cx=W*(1.22-lane), cy=baseY+H*yOffset;
      const cw=baseW*size, ch=cw*(344/720)*(+cloudShapeEl.value/100)*(1+(i%3-1)*.08);
      cloudCtx.save();
      cloudCtx.globalAlpha=(+cloudOpacityEl.value/100)*(i===0?1:.82);
      cloudCtx.filter='blur('+(1.5+size*1.2)+'px)';
      if(direction<0){ cloudCtx.translate(cx,0); cloudCtx.scale(-1,1); cloudCtx.drawImage(cloudImg,-cw/2,cy-ch/2,cw,ch); }
      else cloudCtx.drawImage(cloudImg,cx-cw/2,cy-ch/2,cw,ch);

    }
    cloudCtx.globalAlpha=1;
    cloudCtx.globalCompositeOperation='destination-in';

  }

  function drawMovingPhoto(target, time, speed, amount, foam){
    target.clearRect(0,0,W,H);
    const strip = foam ? 7 : 11;
    const pad = amount + 2;
    for(let y=0; y<H; y+=strip){
      const h = Math.min(strip+1,H-y);
      const depth = y/H;
      const phase = time*speed + y*(foam ? 0.075 : 0.032);
      const dx = Math.sin(phase)*amount*(foam ? 0.9 : 0.25+0.75*depth);
      const dy = foam ? Math.cos(phase*0.72)*amount*0.35 : Math.cos(phase*0.57)*amount*0.12;
      const sy = y/H*img.naturalHeight;
      const sh = h/H*img.naturalHeight;
      target.drawImage(img,0,sy,img.naturalWidth,sh,dx-pad,y+dy,W+pad*2,h);
    }
  }

  function randomWaterPoint(preferWedge){
    for(let tries=0; tries<50; tries++){
      const x = Math.random();
      const y = 0.20 + Math.random()*0.80;
      if (preferWedge && !pointInPoly(x,y,WEDGE)) continue;
      if (maskAlphaAt(x,y) > ALPHA_SPAWN_THRESHOLD) return [x,y];
    }
    for(let tries=0; tries<80; tries++){
      const x = Math.random();
      const y = 0.20 + Math.random()*0.80;
      if (maskAlphaAt(x,y) > ALPHA_SPAWN_THRESHOLD) return [x,y];
    }
    return [0.9,0.85];
  }

    for(let tries=0; tries<120; tries++){

        bctx.translate(px, py);
        bctx.rotate(p.angle);
        const grad = bctx.createLinearGradient(-r*2.6,0,r*2.6,0);
        grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0)`);
        grad.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
        grad.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
        bctx.fillStyle = grad;
        bctx.beginPath();
        bctx.ellipse(0,0, r*2.6, r*0.55, 0, 0, Math.PI*2);
        bctx.fill();
        bctx.restore();
      } else {
        const grad = bctx.createRadialGradient(px,py,0, px,py, r*3.2);
        grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
        grad.addColorStop(0.35, `rgba(${c[0]},${c[1]},${c[2]},${alpha*0.55})`);
        grad.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
        bctx.fillStyle = grad;
        bctx.beginPath();
        bctx.arc(px,py, r*3.2, 0, Math.PI*2);
        bctx.fill();
      }
    }

    // Multiply by the photo-derived, feathered water mask so sparkle only
    // ever shows up inside real water, fading out at the true edge.
    bctx.globalCompositeOperation = 'destination-in';
    bctx.drawImage(waterMaskBuffer, 0, 0, W, H);
    bctx.globalCompositeOperation = 'source-over';

    // Second sparkle pass: same twinkle language, clipped only by the
    // independent foam mask above.
    fbctx.clearRect(0,0,W,H);
    for(const p of foamParticles){
      const osc=Math.max(0,Math.sin(time*p.freq*2*Math.PI+p.phase));
      const twinkle=Math.pow(osc,p.sharp);
      const alpha=Math.min(1,twinkle*.92*intensity);
      if(alpha<.025) continue;
      const px=p.nx*W, py=p.ny*H, r=Math.max(.35,p.size*(W/1200)*(1+.55*twinkle));
      fbctx.save();
      fbctx.translate(px,py); fbctx.rotate(p.angle);
      const grad=fbctx.createRadialGradient(0,0,0,0,0,r*3.1);
      grad.addColorStop(0,`rgba(248,254,255,${alpha})`);
      grad.addColorStop(.34,`rgba(235,251,255,${alpha*.48})`);
      grad.addColorStop(1,'rgba(235,251,255,0)');
      fbctx.fillStyle=grad;
      fbctx.beginPath();
      fbctx.ellipse(0,0,p.streak?r*3.0:r*1.8,p.streak?r*.52:r*1.8,0,0,Math.PI*2);
      fbctx.fill(); fbctx.restore();
    }
    fbctx.globalCompositeOperation='destination-in';
    fbctx.drawImage(foamMask,0,0,W,H);
    fbctx.globalCompositeOperation='source-over';

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bufferCanvas, 0, 0, W, H);
    ctx.drawImage(foamBuffer, 0, 0, W, H);

    previewCtx.clearRect(0,0,W,H);
    if (maskToggle.checked){
      drawTintedMask(waterMaskBuffer,'#00bcd4',.55);
    }
    if (foamMaskToggle.checked){
      drawTintedMask(foamMask,'#8b00ff',.78);
    }
    if (rockMaskToggle.checked){
      previewCtx.save(); previewCtx.globalAlpha=.6; previewCtx.fillStyle='#ff5a3c';
      for (const spot of ROCK_SPOTS){
        const sizeScale=+spot.sizeEl.value/100;
        const featherPx=Math.max(1, +spot.featherEl.value/100 * 0.03 * W);
        const cx=spot.x*W, cy=spot.y*H;
        const rxpx=spot.rx*W*sizeScale, rypx=spot.ry*W*sizeScale;
        const favg=featherPx/Math.max(1,(rxpx+rypx)/2);
        previewCtx.save();
        previewCtx.translate(cx,cy);
        previewCtx.scale(rxpx,rypx);
        previewCtx.beginPath(); previewCtx.arc(0,0,1+favg,0,Math.PI*2); previewCtx.fill();
        previewCtx.restore();
      }
      previewCtx.restore();
    }
    if (cloudMaskToggle.checked){
      previewCtx.save();
      previewCtx.fillStyle=cloudFadeGradient(previewCtx);
      previewCtx.fillRect(0,0,W,H);
      previewCtx.globalCompositeOperation='source-in';
      previewCtx.globalAlpha=.55; previewCtx.fillStyle='#ff2d9a';
      previewCtx.fillRect(0,0,W,H);
      previewCtx.restore();
    }

    requestAnimationFrame(draw);
  }

  // ---- Settings save/sync (db capability) --------------------------
  // Persists every control below to this artifact's shared store so the
  // tuning survives a reload and Claude can read back what was changed.
  const SETTINGS_IDS = ['density','speed','intensity','oceanMotionToggle','oceanSpeed','oceanAmount',
    'foamMotionToggle','foamSpeed','foamAmount','rock1Size','rock1Feather','rock2Size','rock2Feather','rock3Size','rock3Feather','rock4Size','rock4Feather','cloudToggle','cloudSpeed','cloudSize','cloudOpacity',
    'cloudHeight','cloudAmount','cloudSpacing','cloudShape','cloudMaskOffset'];
  let dbHandle = null, saveTimer = null, applyingRemote = false;

  function collectSettings(){
    const s = {};
    for (const id of SETTINGS_IDS){
      const el = document.getElementById(id);
      if (!el) continue;
      s[id] = el.type === 'checkbox' ? el.checked : +el.value;
    }
    return s;
  }

  function applySettings(data){
    if (!data) return;
    applyingRemote = true;
    for (const id of SETTINGS_IDS){
      if (!(id in data)) continue;
      const el = document.getElementById(id);
      if (!el) continue;
      if (el.type === 'checkbox') el.checked = !!data[id];
      else el.value = data[id];
      const valueEl = document.getElementById(id+'Value');
      if (valueEl) valueEl.textContent = el.value;
    }
    seedParticles();
    applyingRemote = false;
  }

  function scheduleSave(){
    if (applyingRemote || !dbHandle) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      dbHandle.doc('settings/current').set(collectSettings()).catch(()=>{});
    }, 500);
  }

  async function initSettingsSync(){
    try{
      dbHandle = (window.claude && window.claude.use) ? await window.claude.use('db') : null;
    }catch(e){ dbHandle = null; }
    if (!dbHandle) return;
    try{
      const snap = await dbHandle.doc('settings/current').get();
      if (snap.exists) applySettings(snap.data());
    }catch(e){}
    dbHandle.doc('settings/current').onSnapshot((snap)=>{
      if (snap.exists && !snap.metadata.hasPendingWrites) applySettings(snap.data());
    }, ()=>{});
  }

  async function init(){
    resize();
    await loadMask();
    seedParticles();
    requestAnimationFrame(draw);
    initSettingsSync();
  }

  window.addEventListener('resize', ()=>{ resize(); });
  const densityValueEl = document.getElementById('densityValue');
  densityEl.addEventListener('input', ()=>{ densityValueEl.textContent = densityEl.value; seedParticles(); scheduleSave(); });
  regenBtn.addEventListener('click', seedParticles);
  for(const id of ['oceanSpeed','oceanAmount','foamSpeed','foamAmount','rock1Size','rock1Feather','rock2Size','rock2Feather','rock3Size','rock3Feather','rock4Size','rock4Feather','cloudSpeed','cloudSize','cloudOpacity','cloudHeight','cloudAmount','cloudSpacing','cloudShape','cloudMaskOffset']){
    const el=document.getElementById(id), value=document.getElementById(id+'Value');
    el.addEventListener('input',()=>{ value.textContent=el.value; scheduleSave(); });
  }
  for(const id of ['speed','intensity']){
    const el=document.getElementById(id), value=document.getElementById(id+'Value');
    el.addEventListener('input',()=>{ value.textContent=el.value; scheduleSave(); });
  }
  for(const id of ['oceanMotionToggle','foamMotionToggle','cloudToggle']){
    document.getElementById(id).addEventListener('change', scheduleSave);
  }
  maskToggle.addEventListener('change', ()=>{ maskBadge.style.display = maskToggle.checked ? 'block':'none'; });
  foamMaskToggle.addEventListener('change', ()=>{ foamMaskBadge.style.display = foamMaskToggle.checked ? 'block':'none'; });
  rockMaskToggle.addEventListener('change', ()=>{ rockMaskBadge.style.display = rockMaskToggle.checked ? 'block':'none'; });

  if (img.complete) init(); else img.addEventListener('load', init);
})();
</script>
</body>
</html>
